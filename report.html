<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Preparing…</title>
<link rel="icon" type="image/svg+xml" href="/osqa-icon.svg">
<style>
  html,body{margin:0;height:100%;background:#fff;color:#5F6369;
    font:600 15px/1.6 'Cairo',-apple-system,system-ui,sans-serif}
  main{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center}
  .dot{width:34px;height:34px;border-radius:50%;border:3px solid #DCE3EA;border-top-color:#0033A0;animation:sp .8s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
  @media(prefers-reduced-motion:reduce){.dot{animation:none}}
</style>
</head>
<body>
<!--
  A printable document needs a real address of its own: Safari on iPhone and iPad will not
  print a page written into about:blank. This page is that address — it asks the app that
  opened it for the finished document (an inspection report, or an export) and becomes it.
-->
<main><div class="dot" aria-hidden="true"></div><p id="msg">Preparing the document…</p></main>
<script src="/js/report-page.js"></script>
</body>
</html>
